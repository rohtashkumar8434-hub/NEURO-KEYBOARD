name: Build Neuro Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o NEURO-KEYBOARD-Android-Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: NEURO-KEYBOARD
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: neuro-keyboard-debug-apk
          path: NEURO-KEYBOARD/app/build/outputs/apk/debug/app-debug.apk
